name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
        working-directory: calendar-booking/backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: calendar-booking/frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: calendar-booking/frontend

      - name: Start servers
        run: |
          nohup ./venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          cd ../frontend && npm run build
          nohup npx vite preview --port 3000 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/event-types > /dev/null && curl -sf http://localhost:3000 > /dev/null && echo "Servers ready" && exit 0
            sleep 1
          done
          echo "Servers failed to start"
          echo "=== Backend log ==="
          cat /tmp/backend.log
          echo "=== Frontend log ==="
          cat /tmp/frontend.log
          exit 1
        working-directory: calendar-booking/backend

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: calendar-booking/frontend

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: calendar-booking/frontend/playwright-report/
          retention-days: 7
